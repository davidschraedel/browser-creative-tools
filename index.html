<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Browser Creative Tools</title>
    <link rel="icon" type="image/svg+xml" href="assets/bc-logo.svg" />
    <link rel="stylesheet" href="assets/site-nav.css" />
    <style>
      :root {
        --bg: #15171a;
        --panel: #1e2125;
        --ink: #ece8e1;
        --mute: #8d9299;
        --line: #2f343a;
        --acc: #c6a07c;
        --accink: #1a1410;
      }
      @media (prefers-color-scheme: light) {
        :root:not([data-theme="dark"]) {
          --bg: #eceae6;
          --panel: #f7f6f3;
          --ink: #1c1e21;
          --mute: #6a6f76;
          --line: #d6d3cc;
          --acc: #8a5a34;
          --accink: #fff;
        }
      }
      :root[data-theme="light"] {
        --bg: #494949;
        --panel: #f7f6f3;
        --ink: #1c1e21;
        --mute: #6a6f76;
        --line: #d6d3cc;
        --acc: #8a5a34;
        --accink: #fff;
      }
      :root[data-theme="dark"] {
        --bg: #15171a;
        --panel: #1e2125;
        --ink: #ece8e1;
        --mute: #8d9299;
        --line: #2f343a;
        --acc: #c6a07c;
        --accink: #1a1410;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          15px/1.45 "Avenir Next",
          Avenir,
          "Segoe UI",
          system-ui,
          sans-serif;
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 28px 20px;
      }
      h1 {
        font:
          700 28px/1.1 Georgia,
          "Iowan Old Style",
          serif;
        margin: 0 0 20px;
      }
      .sub {
        color: var(--mute);
      }
      .cards {
        display: grid;
        gap: 12px;
      }
      .card {
        display: block;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 16px;
        color: inherit;
        text-decoration: none;
      }
      .card:hover {
        border-color: var(--acc);
      }
      .card:focus-visible {
        outline: 2px solid var(--acc);
        outline-offset: 2px;
      }
      .card h2 {
        margin: 0 0 4px;
        font-size: 18px;
      }
      .card p {
        margin: 0;
        color: var(--mute);
      }
    </style>
  </head>
  <body>
    <nav class="site-nav" aria-label="Site">
      <a class="logo-link" href="index.html" aria-label="Home" aria-current="page"
        ><img class="logo" src="assets/bc-logo.svg" alt="" width="36" height="36"
      /></a>
      <div class="links">
        <a href="pixel-shuffle.html">Pixel shuffle</a>
        <a href="pixel-cluster-shuffle.html">Shape shuffle</a>
        <a href="layer-vectorizer.html">Layer vectorizer</a>
      </div>
    </nav>
    <main>
      <h1>Browser Creative Tools</h1>
      <div class="cards">
        <a class="card" href="pixel-shuffle.html">
          <h2>Pixel shuffle</h2>
          <p>Randomly swap pixels in an image.</p>
        </a>
        <a class="card" href="pixel-cluster-shuffle.html">
          <h2>Shape shuffle</h2>
          <p>Shuffle clusters of pixels as shapes.</p>
        </a>
        <a class="card" href="layer-vectorizer.html">
          <h2>Layer vectorizer</h2>
          <p>Turn an image into layered SVG shapes.</p>
        </a>
      </div>
    </main>
  </body>
</html>
